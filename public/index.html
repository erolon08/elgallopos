<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL GALLO POS</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>EL GALLO POS</h1><small>Cerrajería El Gallo</small></div>
    <div class="nav" id="nav">
      <button data-screen="dashboard" class="active">📊 Dashboard</button>
      <button data-screen="stock">🏷️ Stock</button>
      <button disabled>🛒 Venta <span class="tag">próximamente</span></button>
      <button disabled>💰 Caja <span class="tag">próximamente</span></button>
      <button disabled>👥 Clientes <span class="tag">próximamente</span></button>
      <button disabled>📦 Productos <span class="tag">próximamente</span></button>
      <button disabled>🔧 Rendición cerrajeros <span class="tag">próximamente</span></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h2 id="screenTitle">Dashboard</h2>
      <div class="top-actions"><span class="badge red">LAN conectada</span></div>
    </header>
    <div class="content">

      <section class="screen active" id="dashboard">
        <div class="card">
          <div class="section-title"><h3>EL GALLO POS</h3></div>
          <p>Sistema en construcción. El módulo <b>Stock</b> ya está funcional — accedé desde el menú lateral.</p>
        </div>
      </section>

      <section class="screen" id="stock">
        <div class="card">
          <div class="section-title"><h3>Stock en tiempo real</h3><span class="badge green" id="liveBadge">Sincronizado</span></div>
          <div class="toolbar">
            <div class="field"><label>Buscar</label><input id="stockSearch" placeholder="Código o descripción..."></div>
            <div class="field"><label>Familia</label><select id="stockFamilia"><option value="">Todas</option></select></div>
            <label class="field" style="flex-direction:row;align-items:center;gap:6px;padding-bottom:9px">
              <input type="checkbox" id="stockSoloBajoMinimo" style="width:auto"> Solo bajo mínimo
            </label>
            <button class="btn primary" id="btnBuscarStock">Buscar</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Código</th><th>Producto</th><th>Familia</th><th>Actual</th><th>Mínimo</th><th>Estado</th><th></th></tr></thead>
              <tbody id="stockBody"></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>
</div>

<div class="modal" id="ajusteModal">
  <div class="modal-box">
    <div class="section-title"><h3 id="ajusteTitulo">Ajuste de stock</h3><button class="btn light" onclick="closeAjuste()">✕</button></div>
    <div class="two-col-form">
      <div class="field"><label>Cantidad (+ suma / − resta)</label><input id="ajusteCantidad" type="number" step="any" placeholder="ej: -2 o 10"></div>
      <div class="field"><label>Motivo</label><input id="ajusteMotivo" placeholder="ej: rotura, conteo físico..."></div>
    </div>
    <div class="toolbar" style="margin-top:14px">
      <button class="btn primary" onclick="confirmarAjuste()">Guardar ajuste</button>
      <button class="btn outline" onclick="closeAjuste()">Cancelar</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
